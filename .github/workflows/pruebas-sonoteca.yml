name: Verificación de Sonoteca

on:
  push:
    paths:
      - "proyectos/playlist/**"
      - ".github/workflows/pruebas-sonoteca.yml"
  pull_request:
    paths:
      - "proyectos/playlist/**"
      - ".github/workflows/pruebas-sonoteca.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: proyectos/playlist
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "proyectos/playlist/requirements*.txt"
      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt
      - name: Comprobar sintaxis e importación del programa
        run: |
          python -m compileall -q main.py models controllers services views
          python -c "from main import construir_controlador; from views.vista_sonoteca import VistaSonoteca; from controllers.controlador_biblioteca import ControladorBiblioteca; VistaSonoteca(ControladorBiblioteca())"
      - name: Revisar estilo
        run: python -m ruff check .
      - name: Revisar formato
        run: python -m ruff format --check .
